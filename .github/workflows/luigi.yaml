name: Luigi

on:
  pull_request:
    branches: [ "main" ]
    paths: [ "homelab/luigi/**/*" ]
  push:
    branches: [ "main" ]
    paths: [ "homelab/luigi/**/*" ]

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homelab/luigi/terraform
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15
      - name: Setup 1Password CLI
        uses: 1Password/install-cli-action@v4
      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILNET_PING }}
      - name: Initialize Terraform
        env:
          TF_CLI_ARGS_init: -backend-config=bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}
        run: terraform init
      - name: Check Terraform format
        run: terraform fmt -check
      - name: Run Terraform Plan
        id: plan
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -o pipefail
          op run --env-file .env.tpl -- \
            terraform \
            plan \
            -no-color \
            -input=false \
            -refresh=false \
            -lock=false \
            -out=luigi.tfplan \
            2>&1 | tee plan.txt
        continue-on-error: true
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const max = 65000;
            let plan = fs.readFileSync('homelab/luigi/terraform/plan.txt', 'utf8');
            if (plan.length > max) {
              plan = plan.slice(-max);
            }
            const body = [
              '### Terraform Plan — `homelab/luigi/terraform` (`' + process.env.PLAN_OUTCOME + '`)',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const marker = '<!-- tf-plan:luigi -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = body + '\n' + marker;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
      - name: Fail if Plan Errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
      - name: Upload Plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: homelab/luigi/terraform/luigi.tfplan

  apply:
    name: terraform apply
    needs: plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: homelab/luigi/terraform
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: homelab/luigi/terraform
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15
      - name: Setup 1Password CLI
        uses: 1Password/install-cli-action@v4
      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILNET_PING }}
      - name: Initialize Terraform
        env:
          TF_CLI_ARGS_init: -backend-config=bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}
        run: terraform init
      - name: Run Terraform Apply
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          op run --env-file .env.tpl -- \
            terraform apply \
            luigi.tfplan

  check_dns:
    name: Check DNS config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dnsmasq
        run: sudo apt-get update -q && sudo apt-get install -y -q dnsmasq-base
      - name: Test dnsmasq config
        # Same include rule as luigi: only *.conf files are read as config.
        run: dnsmasq --test --conf-file=/dev/null --conf-dir=homelab/luigi/dnsmasq.d,*.conf

  write_dns:
    name: Write DNS config
    needs: [apply, check_dns]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup 1Password CLI
        uses: 1Password/install-cli-action@v4
      - name: Load deploy key
        # Private half of the services SSH key that Terraform authorizes for
        # root on luigi (see ../homelab/luigi/terraform/one_password.tf).
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          LUIGI_KNOWN_HOSTS: ${{ vars.LUIGI_KNOWN_HOSTS }}
        run: |
          if [ -z "$LUIGI_KNOWN_HOSTS" ]; then
            echo "::error::Set the LUIGI_KNOWN_HOSTS repo variable (see homelab/luigi/README.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          ( umask 077
            op read "op://yu7fihprz6dmby76gpkpsh7rdy/32vl6nu353ofade3fr3d7cre5e/private key?ssh-format=openssh" > ~/.ssh/luigi )
          printf '%s\n' "$LUIGI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host luigi
            HostName 10.11.0.67
            User root
            IdentityFile ~/.ssh/luigi
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILNET_PING }}
      - name: Back up current config
        run: ssh luigi 'rm -rf /etc/dnsmasq.d.prev && cp -a /etc/dnsmasq.d /etc/dnsmasq.d.prev'
      - name: Write DNS config
        run: scp homelab/luigi/dnsmasq.d/* luigi:/etc/dnsmasq.d/
      - name: Test and restart dnsmasq
        # Luigi runs Alpine, which uses OpenRC rather than systemd.
        # A config that fails `dnsmasq --test` is rolled back before restart.
        # dnsmasq is also kept in the default runlevel so it comes back on
        # its own after a reboot or power loss, not only after a deploy.
        run: |
          ssh luigi '
            if dnsmasq --test; then
              rc-update show default | grep -qw dnsmasq || rc-update add dnsmasq default
              rc-service dnsmasq restart
            else
              rm -rf /etc/dnsmasq.d && mv /etc/dnsmasq.d.prev /etc/dnsmasq.d
              echo "dnsmasq --test failed; previous config restored" >&2
              exit 1
            fi'
