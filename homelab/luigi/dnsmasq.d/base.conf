# Higher cache size for DNS caching in my home network
cache-size=500

# Upstream resolvers. Ignore /etc/resolv.conf so luigi never forwards to
# itself (e.g. if the router later hands out luigi as the DNS server).
# Quad9: filters known-malicious domains and validates DNSSEC.
no-resolv
server=9.9.9.9
server=149.112.112.112

# Don't forward plain names or private-range reverse lookups upstream
domain-needed
bogus-priv

# Homelab base config
domain=lab.rwhq.net
expand-hosts
local=/lab.rwhq.net/
addn-hosts=/etc/dnsmasq.d/lab_hosts.hosts
